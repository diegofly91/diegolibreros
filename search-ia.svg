<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Buscador con IA: flujo RAG conversacional</title>
  <desc id="desc">Arquitectura de los endpoints POST de chat con rutas de recuperación por sitio y global, evidencia RAG y streaming SSE.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101b31"/><stop offset="1" stop-color="#17112d"/></linearGradient>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#173b66"/><stop offset="1" stop-color="#32235d"/></linearGradient>
    <linearGradient id="site" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#103c58"/><stop offset="1" stop-color="#142c4b"/></linearGradient>
    <linearGradient id="global" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#32245d"/><stop offset="1" stop-color="#1e254c"/></linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="9" stdDeviation="12" flood-color="#020713" flood-opacity=".42"/></filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L8 4.5 0 9z" fill="#6f91bb"/></marker>
    <style>
      .title{font:700 30px Arial,sans-serif;letter-spacing:1.2px;fill:#f3f7ff}.subtitle{font:400 16px Arial,sans-serif;fill:#b9c9e4}.section{font:700 16px Arial,sans-serif;letter-spacing:1.8px;fill:#dceaff}.cardTitle{font:700 18px Arial,sans-serif;fill:#f5f8ff}.text{font:400 14px Arial,sans-serif;fill:#c8d5eb}.small{font:400 12px Arial,sans-serif;fill:#aebfdb}.badge{font:700 11px Arial,sans-serif;letter-spacing:.9px;fill:#7ee7ff}.violet{fill:#c5b4ff}.line{stroke:#6f91bb;stroke-width:2;fill:none;marker-end:url(#arrow)}.dash{stroke:#557697;stroke-width:1.5;stroke-dasharray:5 5;fill:none}.card{stroke:#385675;stroke-width:1.2}.pill{font:700 11px Arial,sans-serif;fill:#d9f8ff}
    </style>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <circle cx="1460" cy="85" r="250" fill="#2473a6" opacity=".10"/><circle cx="130" cy="940" r="260" fill="#7551c8" opacity=".09"/>

  <rect x="50" y="38" width="1500" height="112" rx="24" fill="url(#header)" stroke="#4679a7" stroke-opacity=".65"/>
  <text x="88" y="83" class="title">BUSCADOR CON IA · FLUJO RAG CONVERSACIONAL</text>
  <text x="88" y="115" class="subtitle">POST /chat/site/:site y POST /chat/global · recuperación con evidencia y respuesta en tiempo real</text>
  <rect x="1280" y="66" width="220" height="46" rx="23" fill="#122741" stroke="#4ed5ef" stroke-opacity=".6"/>
  <text x="1390" y="94" text-anchor="middle" class="badge">ARQUITECTURA POST</text>

  <!-- request -->
  <rect x="90" y="194" width="1420" height="108" rx="20" fill="#122942" class="card" filter="url(#shadow)"/>
  <rect x="116" y="220" width="52" height="52" rx="15" fill="#195278"/><path d="M132 237h20v4h-20zm0 9h20v4h-20zm0 9h13v4h-13z" fill="#83eaff"/>
  <text x="190" y="234" class="cardTitle">BFF / CLIENTE</text>
  <text x="190" y="258" class="text">POST JSON autenticado · historial + prompt + filtros</text>
  <text x="190" y="281" class="small">Bearer token · visibility · business_unit · respuesta Accept: text/event-stream</text>
  <rect x="1110" y="220" width="166" height="28" rx="14" fill="#173e5d"/><text x="1193" y="239" text-anchor="middle" class="pill">HISTORIAL ≤ 12</text>
  <rect x="1292" y="220" width="174" height="28" rx="14" fill="#173e5d"/><text x="1379" y="239" text-anchor="middle" class="pill">PROMPT VALIDADO</text>
  <path d="M800 302V337" class="line"/>

  <!-- controller -->
  <rect x="290" y="338" width="1020" height="118" rx="20" fill="#152c49" class="card" filter="url(#shadow)"/>
  <text x="330" y="375" class="section">CHATCONTROLLER · BORDE DE APLICACIÓN</text>
  <text x="330" y="404" class="cardTitle">AzureADGuard  +  SiteExistsGuard solo en /site/:site</text>
  <text x="330" y="430" class="text">ValidationPipe · agrega prompt al historial · presupuesto stateless de conversación</text>
  <rect x="1076" y="368" width="190" height="35" rx="17" fill="#1b4968"/><text x="1171" y="390" text-anchor="middle" class="pill">FILTROS PRESERVADOS</text>
  <path d="M800 456V493" class="line"/>

  <!-- split -->
  <path d="M800 494H430V526" class="line"/><path d="M800 494H1170V526" class="line"/>
  <text x="430" y="512" text-anchor="middle" class="badge">RUTA SITE</text><text x="1170" y="512" text-anchor="middle" class="badge violet">RUTA GLOBAL</text>

  <!-- site -->
  <rect x="70" y="530" width="700" height="286" rx="22" fill="url(#site)" class="card" filter="url(#shadow)"/>
  <text x="105" y="568" class="section">1 · RECUPERACIÓN POR SITIO</text>
  <rect x="100" y="590" width="640" height="54" rx="13" fill="#133852"/>
  <text x="122" y="613" class="cardTitle">Hard routes deterministas</text><text x="122" y="633" class="small">Página exacta · catálogo/documento anual · organigrama</text>
  <path d="M420 644V660" class="dash"/>
  <rect x="100" y="662" width="640" height="58" rx="13" fill="#133852"/>
  <text x="122" y="686" class="cardTitle">Política opcional y discovery de documentos</text><text x="122" y="707" class="small">Clasificador fail-open · document_summary descubre; solo chunks originales pasan</text>
  <path d="M420 720V736" class="dash"/>
  <rect x="100" y="738" width="640" height="54" rx="13" fill="#133852"/>
  <text x="122" y="761" class="cardTitle">Plan multi-intent o fallback acotado</text><text x="122" y="781" class="small">Hasta 3 subqueries · fusión RRF por origen · profundidad de contexto adaptativa</text>

  <!-- global -->
  <rect x="830" y="530" width="700" height="286" rx="22" fill="url(#global)" class="card" filter="url(#shadow)"/>
  <text x="865" y="568" class="section">2 · RECUPERACIÓN GLOBAL</text>
  <rect x="860" y="590" width="640" height="54" rx="13" fill="#30275a"/>
  <text x="882" y="613" class="cardTitle">Planificador de necesidades independientes</text><text x="882" y="633" class="small">Una query original o hasta 3 subqueries concurrentes</text>
  <path d="M1180 644V660" class="dash"/>
  <rect x="860" y="662" width="640" height="58" rx="13" fill="#30275a"/>
  <text x="882" y="686" class="cardTitle">Timeout individual · éxito parcial</text><text x="882" y="707" class="small">Conserva los resultados disponibles; no bloquea por un fallo aislado</text>
  <path d="M1180 720V736" class="dash"/>
  <rect x="860" y="738" width="640" height="54" rx="13" fill="#30275a"/>
  <text x="882" y="761" class="cardTitle">Fusión determinista y fallback</text><text x="882" y="781" class="small">Deduplicación por chunk · diversidad de sitio/fuente · rescate si no hay resultados</text>

  <path d="M420 816V852H800V852" class="line"/><path d="M1180 816V852H800" class="line"/>

  <!-- shared -->
  <rect x="320" y="856" width="960" height="100" rx="20" fill="#142d49" stroke="#4788aa" stroke-width="1.3" filter="url(#shadow)"/>
  <text x="356" y="887" class="section">EVIDENCIA Y RESPUESTA COMPARTIDAS</text>
  <text x="356" y="915" class="cardTitle">Azure Cognitive Search + embeddings</text>
  <text x="356" y="939" class="small">Chunks originales → contexto TOON → OpenAI / Azure OpenAI → SSE manual: token · usage opcional · end</text>
  <rect x="1050" y="884" width="190" height="40" rx="20" fill="#16465a"/><text x="1145" y="909" text-anchor="middle" class="pill">SIN RESULTADOS: SIN IA</text>

  <!-- cross-cutting footer -->
  <rect x="50" y="968" width="1500" height="1" fill="#4b698b" opacity=".7"/>
  <text x="70" y="990" class="small">TRANSVERSAL</text>
  <text x="190" y="990" class="small">Stateless</text><circle cx="275" cy="986" r="3" fill="#66dff5"/>
  <text x="293" y="990" class="small">Aborta al desconectar</text><circle cx="465" cy="986" r="3" fill="#66dff5"/>
  <text x="483" y="990" class="small">Clasificadores fail-open</text><circle cx="675" cy="986" r="3" fill="#b9a8ff"/>
  <text x="693" y="990" class="small">Filtros preservados en todas las rutas</text>
</svg>
